[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra
markers =
    unit: fast tests with no external I/O
    integration: tests using the isolated MySQL test database
    api: in-process HTTP API tests
    e2e: key end-to-end user workflows
    nonfunctional: isolated performance, reliability, security, and frontend quality checks
